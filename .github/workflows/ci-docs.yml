name: ci-docs
on: [push, pull_request]
permissions: { contents: read }
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No promises or placeholders in mandatory flows
        run: '! git grep -nE "production-ready|TODO|PLACEHOLDER" -- README.md docs apps packages tools'
      - name: Required documents
        run: test -f docs/progress.md && test -f docs/teaching/glossary.md && test -f THIRD_PARTY_NOTICES.md
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:check
