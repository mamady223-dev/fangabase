name: ci-templates
on: [push, pull_request]
permissions: { contents: read }
jobs:
  templates:
    runs-on: ubuntu-latest
    strategy:
      {
        matrix:
          {
            config:
              [
                cloud,
                cloud-supabase,
                vps-next,
                vps-laravel,
                vps-laravel-inertia-react,
                shared,
                shared-laravel-inertia-react,
                hybrid,
                no-payments,
                billing,
                marketplace,
              ],
          },
      }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fangabase:init --config examples/configs/${{ matrix.config }}.yaml --output /tmp/resolved.yaml --json
  inertia-generated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [vps-laravel-inertia-react, shared-laravel-inertia-react]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - uses: shivammathur/setup-php@ec406be512d7077f68eed36e63f4d91bc006edc4 # v2
        with: { php-version: "8.2", extensions: mbstring, pdo_sqlite, sqlite3 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm fangabase:init --config examples/configs/${{ matrix.config }}.yaml create --destination /tmp/generated-${{ matrix.config }} --yes
      - run: pnpm install --dir /tmp/generated-${{ matrix.config }} --frozen-lockfile --ignore-scripts
      - run: composer install --working-dir=/tmp/generated-${{ matrix.config }} --no-interaction --prefer-dist
      - run: pnpm --dir /tmp/generated-${{ matrix.config }} typecheck
      - run: pnpm --dir /tmp/generated-${{ matrix.config }} test
      - run: pnpm --dir /tmp/generated-${{ matrix.config }} build
