name: Next backend PostgreSQL

on:
  push:
  pull_request:

jobs:
  backend-next:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fangabase
          POSTGRES_PASSWORD: fangabase_test
          POSTGRES_DB: fangabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fangabase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fangabase:fangabase_test@127.0.0.1:5432/fangabase
      DATABASE_DIRECT_URL: postgres://fangabase:fangabase_test@127.0.0.1:5432/fangabase
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --working-dir=apps/server --no-interaction --prefer-dist
      - run: pnpm --filter @fangabase/backend-next migrate
      - run: pnpm --filter @fangabase/backend-next test
      - run: pnpm test:parity
      - run: pnpm --filter @fangabase/web build
